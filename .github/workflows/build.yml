name: build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装构建依赖
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt android-sdk-platform-23
          mkdir -p /tmp/tools
          curl -fsSL -o /tmp/tools/r8.jar \
            https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.3.37/r8-8.3.37.jar
          curl -fsSL -o /tmp/tools/apksig.jar \
            https://dl.google.com/dl/android/maven2/com/android/tools/build/apksig/8.3.0/apksig-8.3.0.jar
          curl -fsSL -o /tmp/tools/protobuf.jar \
            https://repo1.maven.org/maven2/com/google/protobuf/protobuf-java/3.25.5/protobuf-java-3.25.5.jar
          ls -1 /usr/lib/android-sdk/platforms/*/android.jar

      - name: 构建 APK
        run: |
          set -e
          export AJ=$(ls /usr/lib/android-sdk/platforms/*/android.jar | head -1)
          export TOOLS=/tmp/tools
          bash tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: BiliIntlThemeFix
          path: build/BiliIntlThemeFix-signed.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/BiliIntlThemeFix-signed.apk
